name: Bug Report
description: Something in simvyn isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        **Security issue?** Please don't file it here — report it privately via [Security Advisories](https://github.com/pranshuchittora/simvyn/security/advisories/new).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched [existing issues](https://github.com/pranshuchittora/simvyn/issues) and didn't find a duplicate
          required: true
        - label: I'm on the latest version (`npm install -g simvyn@latest`)
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
      placeholder: Running `simvyn location set ...` printed a stack trace instead of an error message.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact commands or dashboard clicks that trigger the bug.
      placeholder: |
        1. Connect a physical Android device over USB
        2. Run `simvyn device list`
        3. Run `simvyn location set <device> 42 44`
        4. See error
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - CLI
        - Web dashboard
        - Both
    validations:
      required: true

  - type: dropdown
    id: device-type
    attributes:
      label: Device type
      multiple: true
      options:
        - iOS Simulator
        - Android Emulator
        - Physical iOS device
        - Physical Android device
        - Not device-specific
    validations:
      required: true

  - type: input
    id: simvyn-version
    attributes:
      label: simvyn version
      description: Output of `simvyn --version`
      placeholder: "2.6.8"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2 (Apple Silicon) / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v22.12.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or debug report
      description: |
        Paste any error output. You can generate a full debug report from the dashboard:
        **Tool Settings → Diagnostics → Debug Report**. This is automatically formatted as code.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, related issues, or workarounds you've found.
