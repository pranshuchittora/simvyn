name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.5.0)"
        required: true
        type: string

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required for npm trusted publishing (OIDC). No NPM_TOKEN is used.
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build release (dashboard + CLI bundle + assets)
        run: npm run build:release

      - name: Verify tarball contents
        working-directory: packages/cli
        run: npm pack --dry-run

      # Authenticates via OIDC against the npm trusted publisher configured for
      # this repo + workflow. Provenance is attached automatically.
      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --ignore-scripts

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --pretty=format:"- %s" "$TAG")
          else
            CHANGES=$(git log --oneline --pretty=format:"- %s" "${PREV_TAG}..${TAG}")
          fi
          echo "$CHANGES" > /tmp/changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: /tmp/changelog.md
