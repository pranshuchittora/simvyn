name: Release Dispatch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.5.0, without v prefix)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: ${{ inputs.version }}"
            echo "Expected format: X.Y.Z (e.g. 2.5.0)"
            exit 1
          fi

      - name: Bump version
        run: npm version ${{ inputs.version }} --no-git-tag-version --workspace=packages/cli

      - name: Commit and tag
        run: |
          git add packages/cli/package.json
          git commit -m "bump to v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"

      - name: Push
        run: |
          git push origin main
          git push origin "v${{ inputs.version }}"
